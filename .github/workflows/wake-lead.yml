name: Wake Lead — Hook GitHub → lead agent

on:
  issues:
    types: [opened, edited, closed, labeled]
  issue_comment:
    types: [created]
  # push sur main : un merge de PR vers main produit un push, exécuté depuis la
  # branche par défaut (contenu déjà mergé) → sûr.
  push:
    branches: [main]

permissions:
  issues: read
  pull-requests: read

jobs:
  wake:
    # ⚠️ CRITIQUE : GitHub évalue ce `if` de JOB AVANT de dispatcher vers le runner.
    # Un `if` d'étape serait évalué SUR le runner (trop tard, le code aurait tourné).
    if: github.actor == 'tboittin'
    runs-on: self-hosted   # runner WSL — a accès à herdr
    steps:
      - name: Construire le message métier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          echo "Message du workflow :"
          echo "  event=$EVENT_NAME/$EVENT_ACTION par @$ACTOR"
          echo "  issue=$ISSUE_NUM title='$ISSUE_TITLE'"
          echo "  pr=$PR_NUM title='$PR_TITLE'"
          if [ -n "$COMMENT_BODY" ]; then echo "  comment: present"; else echo "  comment: absent"; fi
          echo "  label=$LABEL_NAME review=$REVIEW_STATE"
          if [ -n "$PUSH_MESSAGE" ]; then echo "  push=$PUSH_REF commit: present"; else echo "  push: absent"; fi

      - name: Réveiller le lead agent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          # Ignorer si le commentaire contient /no-wakeup
          # (seul usage de COMMENT_BODY : un test de filtre, jamais injecté dans le prompt)
          if echo "$COMMENT_BODY" | grep -q '/no-wakeup'; then
            echo "Commentaire marque /no-wakeup — ignore"
            exit 0
          fi

          # ⚠️ Anti-injection : on ne transmet QUE des métadonnées.
          # Le corps du commentaire (texte potentiellement non fiable) n'est JAMAIS
          # inclus dans le prompt. Le lead lira le commentaire via `gh api` s'il en a besoin.
          MSG="🔔 GitHub: $EVENT_NAME/$EVENT_ACTION par @$ACTOR"
          if [ "$EVENT_NAME" = "push" ]; then
            # Métadonnée uniquement : 1re ligne du message de commit, tronquée à ~150 chars.
            FIRST_LINE=$(printf '%s' "$PUSH_MESSAGE" | head -n 1 | cut -c1-150)
            MSG="🔔 GitHub: push sur main — $FIRST_LINE"
          fi
          if [ -n "$ISSUE_NUM" ]; then MSG="$MSG — issue #$ISSUE_NUM ($ISSUE_TITLE)"; fi
          if [ -n "$PR_NUM" ]; then MSG="$MSG — PR #$PR_NUM ($PR_TITLE)"; fi
          if [ -n "$LABEL_NAME" ]; then MSG="$MSG — label: $LABEL_NAME"; fi
          if [ -n "$REVIEW_STATE" ]; then MSG="$MSG — review: $REVIEW_STATE"; fi

          herdr agent prompt wM:p1 "$MSG" || echo "⚠️ Echec du reveil du lead — voir pane wM:p1"
