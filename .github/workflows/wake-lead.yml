name: Wake Lead — Hook GitHub → lead agent

on:
  issues:
    types: [opened, edited, closed, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  issues: read
  pull-requests: read

jobs:
  wake:
    runs-on: self-hosted   # runner WSL — a accès à herdr
    steps:
      - name: Construire le message métier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          echo "Message du workflow :"
          echo "  event=$EVENT_NAME/$EVENT_ACTION par @$ACTOR"
          echo "  issue=$ISSUE_NUM title='$ISSUE_TITLE'"
          echo "  pr=$PR_NUM title='$PR_TITLE'"
          echo "  comment='$(echo "$COMMENT_BODY" | head -c 200)'"
          echo "  label=$LABEL_NAME review=$REVIEW_STATE"

      - name: Réveiller le lead agent
        shell: bash
        if: github.actor != 'tboittin'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          LABEL_NAME: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          MSG="🔔 GitHub: $EVENT_NAME/$EVENT_ACTION par @$ACTOR"
          if [ -n "$ISSUE_NUM" ]; then MSG="$MSG — issue #$ISSUE_NUM ($ISSUE_TITLE)"; fi
          if [ -n "$PR_NUM" ]; then MSG="$MSG — PR #$PR_NUM ($PR_TITLE)"; fi
          if [ -n "$COMMENT_BODY" ]; then MSG="$MSG — comment: $(echo "$COMMENT_BODY" | head -c 150)"; fi
          if [ -n "$LABEL_NAME" ]; then MSG="$MSG — label: $LABEL_NAME"; fi
          if [ -n "$REVIEW_STATE" ]; then MSG="$MSG — review: $REVIEW_STATE"; fi

          # Réveiller le lead (session hermes du pane wM:p1)
          herdr agent prompt wM:p1 "$MSG" || echo "⚠️ Échec du réveil du lead — voir pane wM:p1"
