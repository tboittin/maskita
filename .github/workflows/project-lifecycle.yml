name: Project Lifecycle — PR → US status → parent issue

on:
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  ##############################################################################
  # PR ouverte → US en "In Review"
  ##############################################################################
  mark-in-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { pull_request } = context; // octokit injecté par github-script
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pull_request.number;
            const prHead = pull_request.head.ref;

            console.log(`PR #${prNumber} ouverte (branche: ${prHead})`);

            // Chercher l'issue liée dans le message de la PR
            // Convention : le titre ou le body de la PR contient "Closes #N" ou "#N"
            const body = (pull_request.body || '') + ' ' + (pull_request.title || '');
            const issueMatch = body.match(/(?:closes|fixes|resolve[s]?)?\s*#(\d+)/i);

            if (!issueMatch) {
              console.log('Aucune issue liée détectée dans la PR — impossible de mettre à jour le Project');
              return;
            }

            const issueNumber = parseInt(issueMatch[1]);
            console.log(`Issue liée : #${issueNumber}`);

            // Mettre à jour le statut dans le Project via GraphQL
            // Note : nécessite le scope `project` sur le token
            const PROJECT_ID = "PVT_kwHOAzQyRs4BkUV1"; // Project #3 "Maskita — Chantier"
            const STATUS_FIELD_ID = "PVTSSF_kwHOAzQyRs4BkUV1"; // Champ "Status"

            // 1. Trouver l'item dans le Project
            try {
              const searchResult = await octokit.graphql(`
                query {
                  node(id: "${PROJECT_ID}") {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `);

              const items = searchResult?.node?.items?.nodes || [];
              const item = items.find(i => i.content?.number === issueNumber);

              if (!item) {
                console.log(`Issue #${issueNumber} non trouvée dans le Project — ajout...`);
                // Ajouter l'issue au Project
                const addResult = await octokit.graphql(`
                  mutation {
                    addProjectV2ItemById(input: {
                      projectId: "${PROJECT_ID}"
                      contentId: "${issueNumber}"
                    }) {
                      item { id }
                    }
                  }
                `);
                console.log(`Issue #${issueNumber} ajoutée au Project`);
                return;
              }

              // 2. Mettre à jour le statut → "In Review"
              // Trouver l'option ID pour "In Review"
              const fieldResult = await octokit.graphql(`
                query {
                  node(id: "${STATUS_FIELD_ID}") {
                    ... on ProjectV2SingleSelectField {
                      options {
                        id
                        name
                      }
                    }
                  }
                }
              `);

              const options = fieldResult?.node?.options || [];
              const inReviewOption = options.find(o => o.name === 'In Review');
              if (!inReviewOption) {
                console.log('Option "In Review" non trouvée dans le champ Status');
                return;
              }

              // Mettre à jour l'item
              await octokit.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${PROJECT_ID}"
                    itemId: "${item.id}"
                    fieldId: "${STATUS_FIELD_ID}"
                    value: {
                      singleSelectOptionId: "${inReviewOption.id}"
                    }
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `);

              console.log(`✅ Issue #${issueNumber} → In Review`);
            } catch (err) {
              console.log(`⚠️ Erreur Project API: ${err.message}`);
              console.log('Le scope `project` est peut-être manquant sur le token.');
            }

  ##############################################################################
  # PR refusée (changes requested) → US en "Blocked" ou "Ready"
  ##############################################################################
  handle-review:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { pull_request, review } = context; // octokit injecté
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pull_request.number;

            // Extraire l'issue liée
            const body = (pull_request.body || '') + ' ' + (pull_request.title || '');
            const issueMatch = body.match(/(?:closes|fixes|resolve[s]?)?\s*#(\d+)/i);
            if (!issueMatch) {
              console.log('Aucune issue liée');
              return;
            }

            const issueNumber = parseInt(issueMatch[1]);
            const reviewBody = review.body || '(pas de commentaire)';

            console.log(`PR #${prNumber} refusée — review liée à l'issue #${issueNumber}`);

            // Poster un commentaire sur l'issue avec le retour de review
            await octokit.rest.issues.createComment({
              owner, repo,
              issue_number: issueNumber,
              body: [
                `## 🔄 PR #${prNumber} — Modifications demandées`,
                '',
                '### Retour de review',
                reviewBody,
                '',
                'Le subagent va analyser ce retour et proposer un nouveau plan.',
                '',
                'Statut mis à jour : **Blocked** (en attente d\'analyse)',
                '',
                '---',
                '🤖 *Review relayée par Hermes Agent*',
              ].join('\n'),
            });

            // Mettre l'US en "Blocked" dans le Project
            try {
              const PROJECT_ID = "PVT_kwHOAzQyRs4BkUV1";
              const STATUS_FIELD_ID = "PVTSSF_kwHOAzQyRs4BkUV1";

              const searchResult = await octokit.graphql(`
                query {
                  node(id: "${PROJECT_ID}") {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue { number }
                          }
                        }
                      }
                    }
                  }
                }
              `);

              const item = (searchResult?.node?.items?.nodes || [])
                .find(i => i.content?.number === issueNumber);

              if (item) {
                const fieldResult = await octokit.graphql(`
                  query {
                    node(id: "${STATUS_FIELD_ID}") {
                      ... on ProjectV2SingleSelectField {
                        options { id name }
                      }
                    }
                  }
                `);
                const blockedOption = fieldResult?.node?.options?.find(o => o.name === 'Blocked');
                if (blockedOption) {
                  await octokit.graphql(`
                    mutation {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: "${PROJECT_ID}"
                        itemId: "${item.id}"
                        fieldId: "${STATUS_FIELD_ID}"
                        value: { singleSelectOptionId: "${blockedOption.id}" }
                      }) { projectV2Item { id } }
                    }
                  `);
                  console.log(`✅ Issue #${issueNumber} → Blocked`);
                }
              }
            } catch (err) {
              console.log(`⚠️ Erreur Project API: ${err.message}`);
            }

  ##############################################################################
  # PR mergée → US "Done" → vérifier prérequis → fermer issue parente
  ##############################################################################
  mark-done:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { pull_request } = context; // octokit injecté par github-script
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Extraire l'issue liée
            const body = (pull_request.body || '') + ' ' + (pull_request.title || '');
            const issueMatch = body.match(/(?:closes|fixes|resolve[s]?)?\s*#(\d+)/i);
            if (!issueMatch) {
              console.log('Aucune issue liée — impossible de suivre le lifecycle');
              return;
            }

            const issueNumber = parseInt(issueMatch[1]);
            console.log(`PR mergée — issue #${issueNumber} terminée`);

            // ── 1. Mettre l'US en "Done" dans le Project ──
            const PROJECT_ID = "PVT_kwHOAzQyRs4BkUV1";
            const STATUS_FIELD_ID = "PVTSSF_kwHOAzQyRs4BkUV1";

            try {
              const searchResult = await octokit.graphql(`
                query {
                  node(id: "${PROJECT_ID}") {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue { number title body }
                          }
                        }
                      }
                    }
                  }
                }
              `);

              const items = searchResult?.node?.items?.nodes || [];
              const doneItem = items.find(i => i.content?.number === issueNumber);

              if (doneItem) {
                const fieldResult = await octokit.graphql(`
                  query {
                    node(id: "${STATUS_FIELD_ID}") {
                      ... on ProjectV2SingleSelectField {
                        options { id name }
                      }
                    }
                  }
                `);
                const doneOption = fieldResult?.node?.options?.find(o => o.name === 'Done');
                if (doneOption) {
                  await octokit.graphql(`
                    mutation {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: "${PROJECT_ID}"
                        itemId: "${doneItem.id}"
                        fieldId: "${STATUS_FIELD_ID}"
                        value: { singleSelectOptionId: "${doneOption.id}" }
                      }) { projectV2Item { id } }
                    }
                  `);
                  console.log(`✅ Issue #${issueNumber} → Done`);
                }

                // ── 2. Vérifier les prérequis : trouver les US qui dépendent de celle-ci ──
                const issueBody = doneItem.content?.body || '';
                const usTagMatch = issueBody.match(/^([A-Z]+-\d+)/m);
                const thisUsTag = usTagMatch ? usTagMatch[1] : null;

                if (thisUsTag) {
                  console.log(`Cette US est "${thisUsTag}" — recherche des dépendantes...`);

                  for (const otherItem of items) {
                    if (otherItem.id === doneItem.id) continue;
                    const otherBody = otherItem.content?.body || '';
                    const otherNumber = otherItem.content?.number;

                    // Vérifier si cette autre US liste thisUsTag comme prérequis
                    const prereqMatch = otherBody.match(/prérequis\s*:\s*(.+)/i);
                    if (prereqMatch && prereqMatch[1].includes(thisUsTag)) {
                      console.log(`→ #${otherNumber} dépend de ${thisUsTag} — passage en Ready`);

                      // Passer en "Ready"
                      const fieldResult2 = await octokit.graphql(`
                        query {
                          node(id: "${STATUS_FIELD_ID}") {
                            ... on ProjectV2SingleSelectField {
                              options { id name }
                            }
                          }
                        }
                      `);
                      const readyOption = fieldResult2?.node?.options?.find(o => o.name === 'Ready');
                      if (readyOption) {
                        await octokit.graphql(`
                          mutation {
                            updateProjectV2ItemFieldValue(input: {
                              projectId: "${PROJECT_ID}"
                              itemId: "${otherItem.id}"
                              fieldId: "${STATUS_FIELD_ID}"
                              value: { singleSelectOptionId: "${readyOption.id}" }
                            }) { projectV2Item { id } }
                          }
                        `);
                        console.log(`✅ #${otherNumber} → Ready (prérequis ${thisUsTag} résolu)`);
                      }
                    }
                  }
                }

                // ── 3. Fermer l'issue parente si toutes ses filles sont Done ──
                // Chercher l'issue parente dans le body de cette issue
                const parentMatch = issueBody.match(/Issue parente\s*:\s*#(\d+)/i);
                if (parentMatch) {
                  const parentNumber = parseInt(parentMatch[1]);
                  console.log(`Issue parente : #${parentNumber}`);

                  // Lister toutes les issues filles (celles qui référencent #parentNumber)
                  const childIssues = [];
                  for (const otherItem of items) {
                    if (otherItem.id === doneItem.id) continue;
                    const otherBody = otherItem.content?.body || '';
                    if (otherBody.includes(`#${parentNumber}`)) {
                      childIssues.push({
                        number: otherItem.content?.number,
                        itemId: otherItem.id,
                      });
                    }
                  }

                  // Vérifier le statut de chaque fille
                  let allDone = true;
                  for (const child of childIssues) {
                    // Récupérer le statut actuel via une query
                    // Pour l'instant, on suppose que si on arrive ici, c'est que
                    // les autres filles sont déjà en Done (checké via leur body)
                    // Approximation : compter les issues filles restantes
                    console.log(`  Fille #${child.number} — statut à vérifier`);
                  }

                  // Pour une vérification plus fiable, on utilise une approche
                  // plus simple : on compte les issues filles encore ouvertes
                  const { data: parentIssue } = await octokit.rest.issues.get({
                    owner, repo, issue_number: parentNumber,
                  });

                  // Chercher dans les commentaires du parent le recap des US créées
                  const { data: comments } = await octokit.rest.issues.listComments({
                    owner, repo, issue_number: parentNumber,
                  });

                  // Analyser le dernier commentaire de recap
                  const recapComment = comments.find(c =>
                    c.body && c.body.includes('## ✅ Plan validé')
                  );

                  if (recapComment) {
                    // Extraire les numéros d'issues listées dans le recap
                    const usMatches = recapComment.body.matchAll(/#(\d+)/g);
                    const usNumbers = [...usMatches].map(m => parseInt(m[1]));

                    let allChildrenDone = true;
                    const remaining = [];

                    for (const usNum of usNumbers) {
                      try {
                        const { data: usIssue } = await octokit.rest.issues.get({
                          owner, repo, issue_number: usNum,
                        });
                        if (usIssue.state !== 'closed') {
                          allChildrenDone = false;
                          remaining.push(`#${usNum}`);
                        }
                      } catch {
                        // issue peut ne pas exister (draft)
                      }
                    }

                    if (allChildrenDone && parentIssue.state === 'open') {
                      // Fermer l'issue parente
                      await octokit.rest.issues.update({
                        owner, repo,
                        issue_number: parentNumber,
                        state: 'closed',
                        state_reason: 'completed',
                      });
                      console.log(`✅ Issue parente #${parentNumber} fermée — toutes les US sont Done`);
                    } else if (!allChildrenDone) {
                      console.log(`⏳ Issue parente #${parentNumber} encore ouverte — US restantes: ${remaining.join(', ')}`);
                    }
                  }
                }

              } else {
                console.log(`Issue #${issueNumber} non trouvée dans le Project`);
              }
            } catch (err) {
              console.log(`⚠️ Erreur Project API: ${err.message}`);
              console.log('Le scope `project` est peut-être manquant sur le token.');
            }

  ##############################################################################
  # Nettoyage post-merge (sur self-hosted runner)
  ##############################################################################
  cleanup:
    needs: mark-done
    if: |
      always() &&
      needs.mark-done.result == 'success'
    runs-on: [self-hosted, linux, wsl]
    steps:
      - name: Nettoyer le worktree et le pane
        run: |
          ISSUE_NUM="${{ github.event.pull_request.head.ref }}"
          echo "Nettoyage pour la PR mergée — branche: $ISSUE_NUM"
          echo "TODO: implémenter quand le self-hosted runner sera configuré"
          echo "- herdr pane close"
          echo "- rm -rf worktree"
          echo "- git branch -D"
          echo "- git push origin --delete branche"
