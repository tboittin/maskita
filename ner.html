<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maskita — Détection avancée (expérimental)</title>
    <!--
      MSK-004 — CSP propre à cette page. Par rapport à index.html :
      - connect-src 'self' : la page peut télécharger le modèle depuis ce
        site (/modeles/), et uniquement depuis ce site ;
      - 'wasm-unsafe-eval' : nécessaire pour exécuter le moteur WebAssembly ;
      - worker-src 'self' blob: : le Web Worker et le moteur WebAssembly
        (chargé en blob: pour le cache).
      Aucune autre origine n'est autorisée : le document ne peut pas sortir.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval' blob:;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
      connect-src 'self';
      img-src 'self' data:;
      font-src 'self';
      form-action 'none';
      base-uri 'self';
    ">
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ner/main.tsx"></script>
  </body>
</html>
